name: deploy-ios

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - 'supabase/**'
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: deploy-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          brew install cocoapods
          gem install cocoapods fastlane

      - name: Write .env
        run: |
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\n' "${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" > .env
          printf 'EXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Set build number
        run: node scripts/set-build-number.mjs ${{ github.run_number }}

      - name: Expo prebuild (iOS)
        run: pnpm exec expo prebuild --platform ios --no-install

      - name: Copy fastlane config
        run: cp -r fastlane ios/fastlane

      - name: Pod install
        run: cd ios && pod install

      - name: Bundle init fastlane
        run: cd ios && bundle init && bundle add fastlane && bundle install

      - name: Write ASC key
        run: |
          mkdir -p ~/private_keys
          printf '%s' "${{ secrets.ASC_AUTH_KEY }}" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Run fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PROVISIONING_PROFILE_MAPPING: ${{ secrets.MATCH_PROVISIONING_PROFILE_MAPPING }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: cd ios && bundle exec fastlane beta

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ios/build/*.ipa
          retention-days: 7